# docker-compose.yml : Navidrome, serveur de musique
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    user: "1000:1000"
    ports:
      - "127.0.0.1:4533:4533"   # le NAS seulement
    environment:
      - TZ=America/Toronto
      - ND_LOGLEVEL=info
    volumes:
      - /volume2/appdata/navidrome:/data
      # :ro = lecture seule, il ne touche pas tes fichiers
      - /volume1/media/musique:/music:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    restart: unless-stopped
