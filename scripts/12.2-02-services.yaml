# services.yaml
- Médiathèque:
    - Radarr:
        # navigateur : l'adresse publiee par Serve (6.1)
        href: https://nas.exemple.ts.net:7878
        icon: radarr.png
        description: Films
        # pastille : le nom REEL du conteneur (docker ps),
        # souvent servarr-radarr-1 sans container_name
        server: mon-docker
        container: servarr-radarr-1
        widget:
          type: radarr
          # widget : le nom du conteneur, meme reseau
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
