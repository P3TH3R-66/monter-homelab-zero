# /volume2/docker/servarr/docker-compose.yml (extrait)
services:
  prowlarr:
    image: ghcr.io/hotio/prowlarr:release-X.Y.Z
    # les apps se parlent par le reseau Docker
    ports: ["127.0.0.1:9696:9696"]
    networks: [media-backend]
    volumes: ["/volume2/appdata/prowlarr:/config"]
    environment: [PUID=1000, PGID=1000, TZ=America/Toronto]
    restart: unless-stopped

  radarr:                         # films
    image: ghcr.io/hotio/radarr:release-X.Y.Z
    ports: ["127.0.0.1:7878:7878"]
    networks: [media-backend]
    volumes:
      - /volume2/appdata/radarr:/config
      - /volume1/media:/data       # meme /data partout
    environment: [PUID=1000, PGID=1000, TZ=America/Toronto]
    restart: unless-stopped

  sonarr:                         # series (meme recette, port 8989)
    image: ghcr.io/hotio/sonarr:release-X.Y.Z
    ports: ["127.0.0.1:8989:8989"]
    networks: [media-backend]
    volumes:
      - /volume2/appdata/sonarr:/config
      - /volume1/media:/data
    environment: [PUID=1000, PGID=1000, TZ=America/Toronto]
    restart: unless-stopped

networks:
  media-backend:
    external: true
