type: custom:floor3d-card
path: /local/maison/
# change le ?v= a chaque nouveau fichier (cache)
objfile: maison.glb?v=1
# ou sky: "yes" pour ciel, sol et soleil
backgroundColor: "#dfe6ee"
# 0,5 par defaut ; monte si c'est trop sombre
globalLightPower: 0.8
entities:
  - entity: light.salon
    type3d: light
    object_id: Lum_Salon
    light: {lumens: 800, color: "#ffd27a", distance: 500}
