# compose (extrait)
services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:X.Y.Z@sha256:...   # epinglee
    # servie par Tailscale
    ports: ["127.0.0.1:8095:8080"]
    environment:
      - SECURITY_ENABLELOGIN=true        # comptes obligatoires
      - SYSTEM_DEFAULTLOCALE=fr-FR
      - SYSTEM_ENABLEANALYTICS=false     # aucune statistique envoyee
      - TZ=America/Toronto
    volumes:
      - ./configs:/configs                 # comptes et reglages
      # fichiers gardes sur le serveur
      # (versions recentes de Stirling)
      - ./storage:/storage
      # langues d'OCR (autres langues : page OCR de la doc)
      - ./tessdata:/usr/share/tessdata
      - ./customFiles:/customFiles
      - ./pipeline:/pipeline
      - ./logs:/logs
    # Java, OCR et LibreOffice sont gourmands
    mem_limit: 4g
    restart: unless-stopped
